<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#180b2b"/>
      <stop offset="70%" stop-color="#0b0f24"/>
      <stop offset="100%" stop-color="#05060c"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#00f0ff" stroke-width="12" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#b537f2" stroke-width="6" opacity="0.8"/>
  <!-- Pelota de fútbol neón -->
  <g transform="translate(256, 220)">
    <circle r="100" fill="#090d1f" stroke="#00f0ff" stroke-width="7" filter="url(#neonGlow)"/>
    <polygon points="0,-40 38,-12 23,32 -23,32 -38,-12" fill="#b537f2" stroke="#00f0ff" stroke-width="5"/>
    <line x1="0" y1="-40" x2="0" y2="-90" stroke="#00f0ff" stroke-width="5"/>
    <line x1="38" y1="-12" x2="85" y2="-28" stroke="#00f0ff" stroke-width="5"/>
    <line x1="23" y1="32" x2="55" y2="80" stroke="#00f0ff" stroke-width="5"/>
    <line x1="-23" y1="32" x2="-55" y2="80" stroke="#00f0ff" stroke-width="5"/>
    <line x1="-38" y1="-12" x2="-85" y2="-28" stroke="#00f0ff" stroke-width="5"/>
  </g>
  <text x="256" y="420" font-family="'Orbitron', 'Segoe UI', sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6" filter="url(#neonGlow)">QUIZ<tspan fill="#00f0ff">PY</tspan></text>
</svg>